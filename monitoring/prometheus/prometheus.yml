# Prometheus Global Telemetry Configuration
# Complete Monitoring: All EC2 Servers, Services, Running Application, and Containers

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus Telemetry Engine
  - job_name: 'prometheus_master'
    static_configs:
      - targets: ['localhost:9090']

  # 2. EC2 Server 1: Bastion Host Metrics (Node Exporter Port 9100)
  - job_name: 'bastion_ec2_server'
    static_configs:
      - targets: ['10.0.1.100:9100'] # Bastion Host Private IP

  # 3. EC2 Server 2: Jenkins & SonarQube Host Metrics (Node Exporter Port 9100)
  - job_name: 'jenkins_ec2_server'
    static_configs:
      - targets: ['10.0.10.100:9100'] # Jenkins Server Private IP

  # 4. EC2 Server 3: Application & Monitoring Host Metrics (Node Exporter Port 9100)
  - job_name: 'application_ec2_server'
    static_configs:
      - targets: ['node-exporter:9100']

  # 5. Container Monitoring (Jenkins Host cAdvisor - Port 8081)
  - job_name: 'jenkins_host_containers'
    static_configs:
      - targets: ['10.0.10.100:8081']

  # 6. Container Monitoring (Application Host cAdvisor - Port 8080)
  - job_name: 'app_host_containers'
    static_configs:
      - targets: ['cadvisor:8080']

  # 7. Running Production Application Metrics & Health Probes
  - job_name: 'secdo_running_application'
    metrics_path: '/health.php'
    scrape_interval: 10s
    static_configs:
      - targets: ['secdo-app-prod:80']
