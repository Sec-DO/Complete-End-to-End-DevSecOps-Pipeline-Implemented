; SecDO Hardened Production PHP Configuration
[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 10M
post_max_size = 10M

[Session]
session.cookie_httponly = 1
session.cookie_secure = 0 ; Set to 1 if enforcing strict HTTPS
session.use_only_cookies = 1
session.cookie_samesite = "Lax"

[Date]
date.timezone = "UTC"
