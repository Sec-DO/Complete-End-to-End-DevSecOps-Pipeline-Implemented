version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: secdo-app-local
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_NAME=secdo_db
      - DB_USER=secdo_user
      - DB_PASSWORD=secdo_password
      - APP_VERSION=1.0.0-local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - secdo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    container_name: secdo-db-local
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secdo_secret
      - MYSQL_DATABASE=secdo_db
      - MYSQL_USER=secdo_user
      - MYSQL_PASSWORD=secdo_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - secdo-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "secdo_user", "--password=secdo_password"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  secdo-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
