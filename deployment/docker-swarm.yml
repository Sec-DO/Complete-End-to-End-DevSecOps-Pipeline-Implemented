version: '3.8'

services:
  app:
    image: ${ECR_REPO_URI}:${IMAGE_TAG:-latest}
    container_name: secdo-app
    restart: always
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_NAME=secdo_db
      - DB_USER=secdo_user
      - DB_PASSWORD=secdo_pass
    depends_on:
      - db
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  db:
    image: mariadb:11
    container_name: secdo-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=secdo_db
      - MYSQL_USER=secdo_user
      - MYSQL_PASSWORD=secdo_pass
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
