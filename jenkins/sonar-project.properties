# SonarQube Project Configuration
sonar.projectKey=SecDO-DevSecOps-Pipeline
sonar.projectName=SecDO Automated CI/CD & Security Compliance Pipeline
sonar.projectVersion=1.0.0

# Source Code Paths
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/vendor/**,**/tests/**,**/node_modules/**

# Language Configuration
sonar.language=php
sonar.sourceEncoding=UTF-8

# Coverage & Tests (Optional)
sonar.tests=
sonar.php.coverage.reportPaths=
